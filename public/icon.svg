<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#gradBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#f97316" stroke-opacity="0.2" stroke-width="3"/>
  <circle cx="256" cy="256" r="180" fill="url(#gradGlow)"/>

  <!-- Stylized Dumbbell / Athletic Shield Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Central Bar -->
    <rect x="156" y="240" width="200" height="32" rx="8" fill="#e2e8f0"/>
    <!-- Center Knurling Grips -->
    <line x1="220" y1="240" x2="220" y2="272" stroke="#94a3b8" stroke-width="4"/>
    <line x1="238" y1="240" x2="238" y2="272" stroke="#94a3b8" stroke-width="4"/>
    <line x1="256" y1="240" x2="256" y2="272" stroke="#94a3b8" stroke-width="4"/>
    <line x1="274" y1="240" x2="274" y2="272" stroke="#94a3b8" stroke-width="4"/>
    <line x1="292" y1="240" x2="292" y2="272" stroke="#94a3b8" stroke-width="4"/>

    <!-- Left Plate Inner -->
    <rect x="136" y="200" width="24" height="112" rx="7" fill="url(#gradOrange)"/>
    <!-- Left Plate Outer -->
    <rect x="96" y="170" width="34" height="172" rx="10" fill="url(#gradOrange)"/>
    <!-- Left Collar -->
    <rect x="160" y="228" width="10" height="56" rx="3" fill="#cbd5e1"/>

    <!-- Right Plate Inner -->
    <rect x="352" y="200" width="24" height="112" rx="7" fill="url(#gradOrange)"/>
    <!-- Right Plate Outer -->
    <rect x="382" y="170" width="34" height="172" rx="10" fill="url(#gradOrange)"/>
    <!-- Right Collar -->
    <rect x="342" y="228" width="10" height="56" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Accent Energy Sparks -->
  <polygon points="256,70 264,98 292,106 264,114 256,142 248,114 220,106 248,98" fill="#fb923c"/>
</svg>
