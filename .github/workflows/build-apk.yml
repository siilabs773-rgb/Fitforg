name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application web
        run: npm run build
        env:
          BASE_PATH: /

      - name: Synchroniser avec Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FitForge.apk

      - name: Enregistrer l'APK (onglet Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FitForge-apk
          path: FitForge.apk

      - name: Publier dans Releases (téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest FitForge.apk \
            --title "FitForge APK" \
            --notes "APK Android construit automatiquement depuis le commit ${GITHUB_SHA::7}."
